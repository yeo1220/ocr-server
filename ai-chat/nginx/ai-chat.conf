# AI Chat — nginx reverse proxy (OpenAI-compatible API + web UI)
# Install: sudo ./ai-chat/install-nginx.sh

upstream vllm_openai {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 32m;

    # Web chat UI
    location = / {
        return 302 /chat/;
    }

    location /chat/ {
        alias /home/wslaw/ocr-server/ai-chat/www/;
        index index.html;
        try_files $uri $uri/ /chat/index.html;
    }

    location = /health {
        access_log off;
        proxy_pass http://vllm_openai/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OpenAI-compatible API (vLLM)
    location /v1/ {
        proxy_pass http://vllm_openai/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Optional: stream-friendly alias
    location /api/ {
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://vllm_openai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
