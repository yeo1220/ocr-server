server {
    listen 8088;
    server_name _;

    client_max_body_size 32m;

    # Docker 임베디드 DNS로 업스트림을 런타임에 재-resolve한다.
    # (컨테이너 재생성으로 IP가 바뀌어도 stale-IP 502가 재발하지 않도록)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vllm_upstream vllm-gemma-chat;

    location = / {
        return 302 /chat/;
    }

    location /chat/ {
        alias /var/www/chat/;
        index index.html;
        try_files $uri $uri/ /chat/index.html;
    }

    location = /health {
        access_log off;
        proxy_pass http://$vllm_upstream:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://$vllm_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://$vllm_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
