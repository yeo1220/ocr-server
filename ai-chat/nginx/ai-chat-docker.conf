upstream vllm_openai {
    server vllm-qwen-ocr:8000;
    keepalive 32;
}

server {
    listen 8088;
    server_name _;

    client_max_body_size 32m;

    location = / {
        return 302 /chat/;
    }

    location /chat/ {
        alias /var/www/chat/;
        index index.html;
        try_files $uri $uri/ /chat/index.html;
    }

    location = /health {
        access_log off;
        proxy_pass http://vllm_openai/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://vllm_openai/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://vllm_openai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
