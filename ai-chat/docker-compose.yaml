services:
  ai-chat-nginx:
    image: nginx:1.27-alpine
    container_name: ai-chat-nginx
    ports:
      - "8088:8088"
    volumes:
      - ./nginx/ai-chat-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/chat:ro
    networks:
      - vllm_net
    restart: unless-stopped

networks:
  vllm_net:
    external: true
    name: vllm_default
